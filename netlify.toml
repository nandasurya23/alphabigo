# ALPHA × BIGO - NETLIFY PRODUCTION DEPLOYMENT CONFIGURATION
# High-Security Edge Headers, SPA Routing & Optimized Caching

[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback Rewrite (Client-Side Routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Edge Security Headers for All Routes
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    Cache-Control = "public, max-age=0, must-revalidate"

# Permanent Cache for Versioned Static Assets (1 Year)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
